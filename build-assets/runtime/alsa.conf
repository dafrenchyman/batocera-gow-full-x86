# Keep the stock ALSA definitions, then select this Wolf session explicitly.
</usr/share/alsa/alsa.conf>
# Appliance/user hooks otherwise replace this route after the file is parsed.
!@hooks []
pcm.!default {
    type pulse
    server { @func getenv vars [ PULSE_SERVER ] default "" }
    device { @func getenv vars [ PULSE_SINK ] default "" }
}
ctl.!default {
    type pulse
    server { @func getenv vars [ PULSE_SERVER ] default "" }
}
